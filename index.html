<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iQONE Style Multi-Server Post Gen</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }
        .gen-container {
            max-width: 600px;
            margin: 0 auto;
            background: #1a1a1a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { color: #ff2a2a; margin-bottom: 5px; }
        p { color: #ccc; font-size: 14px; margin-bottom: 20px; }
        
        .paste-area {
            width: 100%;
            height: 90px;
            background: #fff;
            color: #555;
            border: 2px dashed #ff2a2a;
            border-radius: 5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-sizing: border-box;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s;
            overflow: hidden;
            padding: 10px;
        }
        .paste-area:focus {
            outline: none;
            background: #fdfdfd;
        }
        .paste-area.has-img {
            border-style: solid;
            border-color: #00ec9a;
            background: #e8f5e9;
            color: #2e7d32;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #333;
            border-radius: 5px;
            background: #fff;
            color: #000;
            font-size: 15px;
            box-sizing: border-box;
        }
        #thumbPreviewBlock {
            margin-bottom: 20px;
            display: none;
        }
        #thumb-preview {
            max-width: 180px;
            height: auto;
            border-radius: 8px;
            border: 2px solid #00ec9a;
        }
        button {
            background: #e50914;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #b80710; }
        textarea {
            width: 100%;
            height: 250px;
            margin-top: 20px;
            padding: 10px;
            background: #222;
            color: #00ec9a;
            border: 1px solid #444;
            border-radius: 5px;
            font-family: monospace;
            box-sizing: border-box;
            display: none;
        }
    </style>
</head>
<body>

<div class="gen-container">
    <h2>🎬 iQONE Style Post Gen</h2>
    <p>Paste image, movie title, and video link to generate iQONE theme HTML code</p>
    
    <div id="imagePasteBox" class="paste-area" contenteditable="true">
        Click here & Paste (Ctrl+V) or Drop Movie Poster Image...
    </div>

    <input type="text" id="movieTitleInput" placeholder="Enter Movie Title (e.g., Movie Name 2026)...">
    <input type="text" id="movieLinkInput" placeholder="Paste Video Embed/Iframe link here...">
    
    <div id="thumbPreviewBlock">
        <p style="margin-bottom: 5px; color: #00ec9a;">Thumbnail Preview:</p>
        <img id="thumb-preview" src="" alt="Poster Preview">
    </div>

    <button onclick="generateBloggerHTML()">Generate HTML</button>
    
    <textarea id="resultOutput" readonly placeholder="Your HTML code will be generated here..."></textarea>
</div>

<script>
let base64Image = "";
const pasteBox = document.getElementById('imagePasteBox');
const previewBlock = document.getElementById("thumbPreviewBlock");
const previewImg = document.getElementById("thumb-preview");

pasteBox.addEventListener('paste', function(e) {
    e.preventDefault();
    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
    
    for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf("image") !== -1) {
            const blob = items[i].getAsFile();
            processImageFile(blob);
            return;
        }
    }
    alert("No valid image found in clipboard! Please copy an image first.");
});

pasteBox.addEventListener('dragover', function(e) { e.preventDefault(); });
pasteBox.addEventListener('drop', function(e) {
    e.preventDefault();
    const files = e.dataTransfer.files;
    if (files.length > 0 && files[0].type.indexOf("image") !== -1) {
        processImageFile(files[0]);
    } else {
        alert("Please drop a valid image file.");
    }
});

function processImageFile(file) {
    const reader = new FileReader();
    reader.onload = function(event) {
        base64Image = event.target.result;
        pasteBox.className = "paste-area has-img";
        pasteBox.innerHTML = "✅ Image Loaded Successfully!";
        previewImg.src = base64Image;
        previewBlock.style.display = "block";
    };
    reader.readAsDataURL(file);
}

function generateBloggerHTML() {
    let titleVal = document.getElementById("movieTitleInput").value.trim();
    let inputVal = document.getElementById("movieLinkInput").value.trim();
    
    if (!base64Image) {
        alert("Please paste or drop a movie thumbnail image first!");
        return;
    }
    if (!titleVal) {
        alert("Please enter the movie title!");
        return;
    }
    if (!inputVal) {
        alert("Please provide the video Embed/Iframe link!");
        return;
    }

    let finalEmbedUrl = inputVal;
    if (inputVal.includes("<iframe")) {
        let srcMatch = inputVal.match(/src=["']([^"']+)["']/);
        if (srcMatch && srcMatch[1]) {
            finalEmbedUrl = srcMatch[1];
        }
    }

    // বিভিন্ন অ্যাড কোডগুলো
    let adCode1 = `<script>atOptions = { 'key' : 'db133ad55e49680f9da9fc69d08e66c4', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };<\/script><script src="https://www.highperformanceformat.com/db133ad55e49680f9da9fc69d08e66c4/invoke.js"><\/script>`;
    
    let adCode2 = `<script async="async" data-cfasync="false" src="https://pl28473663.effectivecpmnetwork.com/b365658e3819defb1c72746c0f92f851/invoke.js"><\/script><div id="container-b365658e3819defb1c72746c0f92f851"><\/div>`;
    
    let adCode3 = `<script>atOptions = { 'key' : 'db133ad55e49680f9da9fc69d08e66c4', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };<\/script><script src="https://www.highperformanceformat.com/db133ad55e49680f9da9fc69d08e66c4/invoke.js"><\/script>`;

    // ভিডিওর ঠিক ভেতরে বা নিচে ব্যবহারের জন্য অ্যাড কোড (যেমন নেটিভ ব্যানার বা ছোট ফ্রেম)
    let videoCompanionAd = `<script>atOptions = { 'key' : 'db133ad55e49680f9da9fc69d08e66c4', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };<\/script><script src="https://www.highperformanceformat.com/db133ad55e49680f9da9fc69d08e66c4/invoke.js"><\/script>`;

    let sidebarAdCode = `<script>atOptions = { 'key' : 'db133ad55e49680f9da9fc69d08e66c4', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {} };<\/script><script src="https://www.highperformanceformat.com/db133ad55e49680f9da9fc69d08e66c4/invoke.js"><\/script>`;

    let directLink3 = `https://www.effectivecpmnetwork.com/nev6xxiqrw?key=68c5e01cecf8b74aa2855fd4d66a1360`;

    // সম্পূর্ণ জেনারেটেড টেমপ্লেট
    let generatedTemplate = `<!-- iQONE Premium Single Post Layout Structure -->
<div class="iqone-movie-post" style="max-width: 1050px; margin: 0 auto; font-family: 'Segoe UI', Roboto, sans-serif; background: #0f1016; color: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: left; border: 1px solid #1e293b; box-sizing: border-box;">
    
    <!-- Ad Placement Extra: Top Header Banner -->
    <div class="iq-ad-slot" style="text-align: center; margin-bottom: 20px; min-height: 90px;">

    <!-- Main Flex Wrapper for Content & Sidebar -->
    <div class="iq-main-wrapper" style="display: flex; flex-wrap: wrap; gap: 25px;">

        <div class="iq-content-area" style="flex: 3; min-width: 280px;">

            <div class="iq-header" style="display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 25px;">

                </div>
                <div class="iq-details" style="flex: 2; min-width: 250px;">

                        <div><strong style="color: #fff; display: inline-block; width: 85px;">Movie:</strong> ${titleVal}</div>

                        <div><strong style="color: #fff; display: inline-block; width: 85px;">Quality:</strong> Web-DL 720p / 1080p</div>

            </div>

            <!-- Ad Placement 1: Top of Video Player -->
            <div class="iq-ad-slot" style="text-align: center; margin: 20px 0; min-height: 90px;">
                ${adCode1}
            </div>

            <!-- iQONE Video Player Area with Video-Attached Ads -->
            <div class="iq-stream-section" style="background: #161824; border: 1px solid #222533; border-radius: 10px; padding: 15px; margin-bottom: 25px;">
                <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 15px; color: #00ec9a; display: flex; align-items: center; gap: 8px; font-weight: 600;">
                    🌐 Multi-Server Streaming (Watch Online: ${titleVal})
                </h3>

                <!-- Responsive Iframe Player Container -->
                <div class="web-embed-wrapper" style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000; border-radius: 6px; border: 1px solid #222533;">
                    <iframe 
                        src="${finalEmbedUrl}" 
                        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" 
                        allowfullscreen="true" 
                        webkitallowfullscreen="true" 
                        mozallowfullscreen="true" 
                        scrolling="no" 
                        frameborder="0"
                        sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation">
                    </iframe>
                </div>

                <!-- 🚀 Video Companion / Attached Ad Slot (Directly Under Video Player Inside Box) -->
                <div class="video-attached-ad" style="margin-top: 15px; text-align: center; background: #0f1016; padding: 10px; border-radius: 6px; border: 1px dashed #2d314a;">
                    <p style="font-size: 11px; color: #64748b; margin: 0 0 5px 0; text-transform: uppercase; letter-spacing: 1px;">Sponsored Advertisement</p>
                    ${videoCompanionAd}
                </div>
            </div>

            <!-- Ad Placement 2: Between Video Player and Download Button -->
            <div class="iq-ad-slot" style="text-align: center; margin: 20px 0; min-height: 90px;">
                ${adCode2}
            </div>

            <!-- iQONE Download Block Area -->
            <div class="iq-download-box" style="text-align: center; background: #161824; border: 1px solid #222533; padding: 20px; border-radius: 10px; margin-bottom: 20px;">
                <h4 style="margin-top: 0; font-size: 15px; color: #fff; margin-bottom: 8px; font-weight: 600;">Fast Download Links - ${titleVal}</h4>
                <p style="font-size: 12px; color: #abb7c4; margin-bottom: 15px; margin-top: 0;">Click below to access direct high-speed cloud download nodes.</p>
                
                <div style="display: flex; flex-direction: column; gap: 10px; max-width: 340px; margin: 0 auto;">
                    <a href="${directLink3}" target="_blank" style="background: linear-gradient(135deg, #00ec9a 0%, #059669 100%); color: #000; padding: 12px 18px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 14px; display: block; box-shadow: 0 4px 12px rgba(0, 236, 154, 0.25);">
                        📥 Direct Download (1080p HD)
                    </a>
                    <a href="${directLink3}" target="_blank" style="background: #222533; color: #abb7c4; padding: 10px 18px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 13px; display: block; border: 1px solid #2d314a;">
                        📥 Mirror Cloud Stream (720p HD)
                    </a>
                </div>
            </div>

        </div>

        <!-- Right Side: Sidebar Ads Area -->
        <div class="iq-sidebar-area" style="flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 20px;">
            
            <!-- Sidebar Widget 1 -->
            <div style="background: #161824; border: 1px solid #222533; padding: 15px; border-radius: 8px; text-align: center;">
                <h4 style="margin: 0 0 12px 0; font-size: 14px; color: #00ec9a; border-bottom: 1px solid #222533; padding-bottom: 8px;">Sponsored Ads</h4>
                <div style="min-height: 250px; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                    ${sidebarAdCode}
                </div>
            </div>

            <!-- Sidebar Widget 2 -->
            <div style="background: #161824; border: 1px solid #222533; padding: 15px; border-radius: 8px; text-align: center;">

    <!-- Copyright Disclaimer Section -->
    <div class="iq-disclaimer" style="background: #161824; border: 1px solid #222533; border-left: 4px solid #e50914; padding: 15px; border-radius: 6px; font-size: 12px; color: #94a3b8; line-height: 1.5; margin-top: 10px;">
        <strong style="color: #fff; display: block; margin-bottom: 4px; font-size: 13px;">⚠️ Disclaimer / Copyright Policy:</strong>

    </div>

</div>`;

    let outputBox = document.getElementById("resultOutput");
    outputBox.value = generatedTemplate;
    outputBox.style.display = "block";
    outputBox.select(); 
}
</script>

</body>
</html>
