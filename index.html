            margin-bottom: 20px;

            align-items: center;
            justify-content: center;

            font-size: 15px;

            outline: none;
            background: #fdfdfd;
        }
        .paste-area.has-img {
            border-style: solid;
            border-color: #00ec9a;
            background: #e8f5e9;
            color: #2e7d32;

            background: #fff;

            border: 2px solid #00ec9a;
        }
        button {
            background: #e50914;
            color: white;

        textarea {

            height: 250px;
            margin-top: 20px;
            padding: 10px;
            background: #222;
            color: #00ec9a;
            border: 1px solid #444;
            border-radius: 5px;
            font-family: monospace;
            box-sizing: border-box;
            display: none;
        }
    </style>
</head>
<body>

<div class="gen-container">
    <h2>🎬 iQONE Style Post Gen</h2>
    <p>Paste image, movie title, and video link to generate iQONE theme HTML code</p>
    
    <div id="imagePasteBox" class="paste-area" contenteditable="true">
        Click here & Paste (Ctrl+V) or Drop Movie Poster Image...
    </div>

    <input type="text" id="movieTitleInput" placeholder="Enter Movie Title (e.g., Movie Name 2026)...">
    <input type="text" id="movieLinkInput" placeholder="Paste Video Embed/Iframe link here...">
    
    <div id="thumbPreviewBlock">
        <p style="margin-bottom: 5px; color: #00ec9a;">Thumbnail Preview:</p>
        <img id="thumb-preview" src="" alt="Poster Preview">
    </div>

    <button onclick="generateBloggerHTML()">Generate HTML</button>
    
    <textarea id="resultOutput" readonly placeholder="Your HTML code will be generated here..."></textarea>
</div>

<script>
let base64Image = "";
const pasteBox = document.getElementById('imagePasteBox');
const previewBlock = document.getElementById("thumbPreviewBlock");
const previewImg = document.getElementById("thumb-preview");

pasteBox.addEventListener('paste', function(e) {
    e.preventDefault();
    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
    
    for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf("image") !== -1) {
            const blob = items[i].getAsFile();
            processImageFile(blob);
            return;
        }
    }
    alert("No valid image found in clipboard! Please copy an image first.");
});

pasteBox.addEventListener('dragover', function(e) { e.preventDefault(); });
pasteBox.addEventListener('drop', function(e) {
    e.preventDefault();
    const files = e.dataTransfer.files;
    if (files.length > 0 && files[0].type.indexOf("image") !== -1) {
        processImageFile(files[0]);
    } else {
        alert("Please drop a valid image file.");
    }
});

function processImageFile(file) {
    const reader = new FileReader();
    reader.onload = function(event) {
        base64Image = event.target.result;
        pasteBox.className = "paste-area has-img";
        pasteBox.innerHTML = "✅ Image Loaded Successfully!";
        previewImg.src = base64Image;
        previewBlock.style.display = "block";
    };
    reader.readAsDataURL(file);
}

    let inputVal = document.getElementById("movieLinkInput").value.trim();
